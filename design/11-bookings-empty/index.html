<body class="bg-background min-h-screen flex justify-center items-start selection:bg-accent-tint selection:text-accent-fill text-text-primary">
<!-- Mobile Frame Container (Strict 393px phone width) -->
<main class="w-full max-w-[393px] min-h-screen bg-background relative flex flex-col justify-between overflow-x-hidden shadow-2xl">
<!-- Top App Bar & Safe Area Header -->
<header class="w-full pt-10 px-margin flex flex-col z-20">
<!-- TopAppBar Shared Component Executed -->
<div class="flex justify-between items-center w-full py-2 bg-transparent">
<!-- Leading: Brand Logo + Handshake Icon -->
<div class="flex items-center gap-2">
<div class="w-9 h-9 rounded-full bg-accent-tint flex items-center justify-center text-accent-fill">
<span class="material-symbols-outlined text-[20px]" data-icon="handshake">handshake</span>
</div>
<span class="text-title font-title font-bold text-accent-fill tracking-tight">Tendo</span>
</div>
<!-- Trailing: Calendar Action Indicator -->
<button aria-label="Calendar overview" class="w-10 h-10 rounded-full flex items-center justify-center text-text-secondary hover:opacity-80 active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="calendar_month">calendar_month</span>
</button>
</div>
<!-- Screen Title & Segmented Filter Control -->
<div class="mt-4 mb-2">
<h1 class="text-display font-display text-text-primary text-[32px] leading-[40px] tracking-tight">Bookings</h1>
</div>
<!-- Segmented Control (Pill container) -->
<div class="w-full p-1 bg-surface-alt rounded-full flex items-center mt-3 shadow-subtle border border-divider/40">
<button class="flex-1 py-2 rounded-full bg-surface text-text-primary font-title text-[14px] leading-5 font-semibold text-center shadow-sm transition-all duration-150 cursor-pointer" type="button">
          Upcoming
        </button>
<button class="flex-1 py-2 rounded-full text-text-secondary hover:text-text-primary font-title text-[14px] leading-5 font-medium text-center transition-all duration-150 cursor-pointer" type="button">
          Past
        </button>
</div>
</header>
<!-- Main Content Canvas (Empty State Focal Presentation) -->
<section class="flex-1 px-margin flex flex-col items-center justify-center py-6 text-center">
<!-- Focal Hero Image Card with Tinted Ambient Shadow -->
<div class="w-full max-w-[280px] aspect-square rounded-2xl overflow-hidden shadow-ambient p-1.5 bg-surface mb-7 border border-surface-container">
<div class="w-full h-full rounded-[14px] overflow-hidden relative">

<div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent pointer-events-none"></div>
</div>
</div>

<div class="max-w-[310px] space-y-2 mb-8">
<h2 class="text-title font-title font-semibold text-text-primary text-[20px] leading-[28px]">
          No bookings yet
        </h2>
<p class="text-body font-body text-text-secondary text-[16px] leading-[24px]">
          Your upcoming services will show up here
        </p>
</div>
<!-- Primary Action Button: 56px Pill Button -->
<button class="w-full max-w-[310px] h-[56px] rounded-full bg-accent-fill hover:bg-accent-pressed active:scale-[0.98] transition-all duration-150 text-white font-label text-label flex items-center justify-center gap-2 shadow-ambient focus:outline-none focus:ring-4 focus:ring-accent-tint" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="search">search</span>
<span>Find a pro</span>
</button>
</section>
<!-- Bottom Navigation Shell (4 items: Home, Bookings [ACTIVE], Inbox, Profile) -->
<nav aria-label="Bottom Navigation" class="w-full bg-surface/95 backdrop-blur-md px-margin pt-2.5 pb-7 flex items-center justify-around shadow-[0_-4px_20px_rgba(31,12,15,0.04)]">
<!-- Home Tab (Inactive) -->
<button class="flex flex-col items-center gap-1 group py-1 px-3 rounded-xl transition-all duration-150 text-text-secondary hover:text-text-primary" type="button">
<div class="w-12 h-8 rounded-full flex items-center justify-center transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>

<span class="text-caption font-caption text-[12px] leading-4 text-text-secondary group-hover:text-text-primary">Home</span>

<div class="w-12 h-8 rounded-full bg-accent-tint flex items-center justify-center transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px] text-accent-fill font-medium" data-icon="calendar_today" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<span class="text-caption font-caption text-[12px] leading-4 font-semibold text-accent-fill">Bookings</span>
</button>
<!-- Inbox Tab (Inactive) -->
<button class="flex flex-col items-center gap-1 group py-1 px-3 rounded-xl transition-all duration-150 text-text-secondary hover:text-text-primary" type="button">
<div class="w-12 h-8 rounded-full flex items-center justify-center transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="chat_bubble">chat_bubble</span>
</div>
<span class="text-caption font-caption text-[12px] leading-4 text-text-secondary group-hover:text-text-primary">Inbox</span>
</button>
<!-- Profile Tab (Inactive) -->
<button class="flex flex-col items-center gap-1 group py-1 px-3 rounded-xl transition-all duration-150 text-text-secondary hover:text-text-primary" type="button">
<div class="w-12 h-8 rounded-full flex items-center justify-center transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
</div>

<div class="w-32 h-1 bg-text-primary/15 rounded-full"></div>
