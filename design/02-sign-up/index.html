<!-- Interactive State Micro-script -->
<script>
    // Minimal interaction script for role card toggling
    document.querySelectorAll('input[name="role"]').forEach((radio) => {
      radio.addEventListener('change', (e) => {
        const labels = document.querySelectorAll('fieldset label');
        labels.forEach(l => {
          l.classList.remove('bg-accent-tint', 'border-2', 'border-accent-fill');
          l.classList.add('bg-surface', 'border', 'border-divider');
          const badge = l.querySelector('.w-6.h-6.rounded-full');
          if (badge) {
            badge.className = "w-6 h-6 rounded-full border border-divider bg-transparent";
            badge.innerHTML = "";
          }
          const iconWrapper = l.querySelector('.rounded-xl');
          if (iconWrapper) {
            iconWrapper.className = "w-10 h-10 rounded-xl bg-surface-alt flex items-center justify-center text-text-secondary";
          }
        });

        const activeLabel = e.target.closest('label');
        activeLabel.classList.remove('bg-surface', 'border-divider');
        activeLabel.classList.add('bg-accent-tint', 'border-2', 'border-accent-fill');
        
        const activeIconWrapper = activeLabel.querySelector('.rounded-xl');
        if (activeIconWrapper) {
          activeIconWrapper.className = "w-10 h-10 rounded-xl bg-surface flex items-center justify-center text-accent-fill shadow-sm";
        }

        const activeBadge = activeLabel.querySelector('.w-6.h-6.rounded-full');
        if (activeBadge) {
          activeBadge.className = "w-6 h-6 rounded-full bg-accent-fill text-surface flex items-center justify-center shadow-xs";
          activeBadge.innerHTML = `<svg class="w-3.5 h-3.5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        }
      });
    });
  </script>
