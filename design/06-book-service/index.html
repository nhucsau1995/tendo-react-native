<body class="bg-background text-text-primary antialiased flex justify-center min-h-screen">
<!-- Mobile Frame (393px width constraint) -->
<main class="w-full max-w-[393px] bg-background min-h-screen flex flex-col relative pb-36">
<!-- Top Bar Component -->
<header class="sticky top-0 z-20 bg-background/90 backdrop-blur-md px-margin pt-10 pb-3 flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-surface border border-divider flex items-center justify-center text-text-primary shadow-ambient active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-display text-title text-text-primary tracking-tight">Book a service</h1>
<span class="font-caption text-caption text-text-secondary mt-0.5">Step 1 of 2</span>
</div>
<button class="text-accent-fill font-label text-label hover:opacity-80 active:scale-95 transition-all duration-150" type="button">
        Skip
      </button>
</header>
<!-- Main Content Flow -->
<div class="px-margin flex flex-col space-y-5 pt-2">
<!-- Provider Mini Card -->
<section class="bg-surface rounded-2xl p-3.5 shadow-ambient flex items-center space-x-3.5">
<div class="relative flex-shrink-0">
<img alt="Maria Lopez, Professional cleaner" class="w-14 h-14 rounded-full object-cover border border-divider" src="https://lh3.googleusercontent.com/aida/ALJJyrCMN4i9vf2i63E2Ic02Qfhqlu6tuxMnSS-EYe0onx4Dv8qdh_U-zVhjJtEvmhxHDj4cLxMfDDyIdpNpkLcqQbnH1668bPEk1wUlayudIi-Kayz4qg3K4nD2XEEkLYHn2Jq7Gznsqk-RjLF0KBgNmyAwLH72rzy75AxQQENra9XHGUepP37Y6FbdTQPIlAB5uIqbzYWkY09cKd8pChIWqn9VFfcWmW_534ecpdf2U7YKGczsbnU4RqRYdbknbw"/>
<span class="absolute -bottom-1 -right-1 bg-support-strong text-white rounded-full p-0.5 border-2 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[13px] fill leading-none" data-icon="check" data-weight="fill">check</span>
</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center space-x-1.5">
<h2 class="font-title text-[17px] leading-tight text-text-primary font-semibold truncate">Maria Lopez</h2>
<span class="bg-accent-tint text-accent-fill font-caption text-[12px] px-2 py-0.5 rounded-full font-medium">Top Pro</span>
</div>
<div class="flex items-center space-x-1 mt-1 text-text-secondary font-caption text-caption">
<span>House cleaning</span>
<span class="text-text-tertiary">•</span>
<span class="text-amber-star material-symbols-outlined text-[15px] fill" data-icon="star" data-weight="fill">star</span>
<span class="font-medium text-text-primary">4.9</span>
<span class="text-text-tertiary">(212)</span>
</div>
</div>
</section>
<!-- Section: Package Selection -->
<section class="space-y-2.5">
<div class="flex items-center justify-between">
<h2 class="font-title text-[18px] text-text-primary font-semibold">Select package</h2>
<span class="font-caption text-caption text-text-secondary">Flexible cancellation</span>
</div>
<div class="space-y-2">
<!-- Standard Package (Unselected) -->
<label class="relative flex items-center justify-between p-4 bg-surface rounded-2xl shadow-ambient border border-divider cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex items-start space-x-3">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-control-border flex items-center justify-center">
<!-- radio empty -->
</div>
<div>
<span class="font-title text-[16px] text-text-primary font-semibold block leading-tight">Standard</span>
<span class="font-caption text-caption text-text-secondary">Light upkeep • 2 hrs</span>
</div>
</div>
<div class="text-right">
<span class="font-title text-[17px] text-text-primary font-bold block">$70</span>
<span class="font-caption text-[12px] text-text-tertiary">$35/hr</span>
</div>
</label>
<!-- Deep Package (SELECTED) -->
<label class="relative flex items-center justify-between p-4 bg-accent-tint/30 rounded-2xl shadow-elevated border-2 border-accent-fill cursor-pointer active:scale-[0.99] transition-transform overflow-hidden">
<span class="absolute top-0 right-0 bg-accent-fill text-white font-caption text-[12px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-bl-lg">

<div class="flex items-start space-x-3">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-accent-fill bg-accent-fill flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-white"></span>
</div>
<div>
<span class="font-title text-[16px] text-text-primary font-semibold block leading-tight">Deep clean</span>
<span class="font-caption text-caption text-text-secondary">Thorough scrubbing • 4 hrs</span>
</div>
</div>
<div class="text-right">
<span class="font-title text-[17px] text-accent-fill font-bold block">$140</span>
<span class="font-caption text-[12px] text-text-secondary">$35/hr</span>
</div>
</label>
<!-- Move-out Package (Unselected) -->
<label class="relative flex items-center justify-between p-4 bg-surface rounded-2xl shadow-ambient border border-divider cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex items-start space-x-3">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-control-border flex items-center justify-center">

</div>
<div>
<span class="font-title text-[16px] text-text-primary font-semibold block leading-tight">Move-out</span>
<span class="font-caption text-caption text-text-secondary">Full empty reset • 5 hrs</span>
</div>
</div>
<div class="text-right">
<span class="font-title text-[17px] text-text-primary font-bold block">$175</span>
<span class="font-caption text-[12px] text-text-tertiary">$35/hr</span>
</div>
</label>
</div>

<button class="flex-shrink-0 w-[54px] py-3 rounded-2xl bg-surface border border-divider shadow-ambient flex flex-col items-center justify-center space-y-1 active:scale-95 transition-all" type="button">

<span class="font-title text-[17px] text-text-primary font-bold">12</span>

<span class="font-title text-[17px] text-text-primary font-bold">13</span>

<span class="font-caption text-[12px] text-text-secondary font-medium">Mon</span>
<span class="font-title text-[17px] text-text-primary font-bold">16</span>
</button>
<!-- Day Pill: Tue 17 -->
<button class="flex-shrink-0 w-[54px] py-3 rounded-2xl bg-surface border border-divider shadow-ambient flex flex-col items-center justify-center space-y-1 active:scale-95 transition-all" type="button">
<span class="font-caption text-[12px] text-text-secondary font-medium">Tue</span>
<span class="font-title text-[17px] text-text-primary font-bold">17</span>
</button>
<!-- Day Pill: Wed 18 -->
<button class="flex-shrink-0 w-[54px] py-3 rounded-2xl bg-surface border border-divider shadow-ambient flex flex-col items-center justify-center space-y-1 active:scale-95 transition-all" type="button">
<span class="font-caption text-[12px] text-text-secondary font-medium">Wed</span>
<span class="font-title text-[17px] text-text-primary font-bold">18</span>
</button>
</div>
</section>
<!-- Section: Time Selection -->
<section class="space-y-2.5">
<h2 class="font-title text-[18px] text-text-primary font-semibold">Select time</h2>
<div class="grid grid-cols-3 gap-2.5">
<!-- 8:00 AM -->
<button class="h-11 rounded-full bg-surface border border-divider shadow-ambient font-label text-label text-text-primary font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            8:00 AM
          </button>
<!-- 10:00 AM (SELECTED) -->
<button class="h-11 rounded-full bg-accent-fill text-white shadow-ambient font-label text-label font-bold flex items-center justify-center space-x-1 ring-2 ring-accent-fill/30" type="button">
<span>10:00 AM</span>
</button>
<!-- 12:00 PM -->
<button class="h-11 rounded-full bg-surface border border-divider shadow-ambient font-label text-label text-text-primary font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            12:00 PM
          </button>
<!-- 2:00 PM -->
<button class="h-11 rounded-full bg-surface border border-divider shadow-ambient font-label text-label text-text-primary font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            2:00 PM
          </button>
<!-- 4:00 PM (Disabled) -->
<button class="h-11 rounded-full bg-surface-dim/40 border border-divider font-label text-label text-text-tertiary/60 opacity-50 flex items-center justify-center space-x-1 cursor-not-allowed" disabled="" type="button">
<span class="line-through">4:00 PM</span>
<span class="text-[12px] uppercase font-bold bg-danger-tint text-danger-text px-1.5 py-0.2 rounded-full ml-1">Full</span>
</button>
</div>
</section>
<!-- Address Card -->
<section class="space-y-2">
<span class="font-caption text-caption text-text-secondary uppercase tracking-wider font-semibold">Service Location</span>
<div class="bg-surface rounded-2xl p-4 shadow-ambient border border-divider flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-accent-tint flex items-center justify-center flex-shrink-0 text-accent-fill">
<span class="material-symbols-outlined text-[20px]" data-icon="location_on">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-title text-[15px] font-semibold text-text-primary leading-tight">Home</span>
<span class="font-caption text-caption text-text-secondary truncate max-w-[190px]">2145 Valencia St, Apt 3, San Francisco</span>
</div>
</div>
<button class="font-label text-label text-accent-fill font-medium underline underline-offset-2 active:opacity-75" type="button">
            Change
          </button>
</div>
</section>
<!-- Special Notes Input -->
<section class="space-y-2 pt-1 pb-2">
<label class="block font-label text-label font-medium text-text-primary" for="instructions">
          Special instructions or notes
        </label>
<div class="relative">
<input class="w-full h-[52px] px-4 rounded-xl bg-surface border border-control-border text-text-primary font-body text-[15px] focus:outline-none focus:ring-2 focus:ring-accent-fill focus:border-transparent transition-all shadow-sm" id="instructions" type="text" value="Please focus on kitchen and bathroom"/>
<span class="absolute right-3.5 top-3.5 material-symbols-outlined text-text-tertiary text-[20px]" data-icon="edit_note">edit_note</span>
</div>
</section>
</div>
<!-- Docked Sticky Bottom Container (Safe Area Clearance, strictly NO Bottom Navigation Tab Bar) -->
<footer class="fixed bottom-0 inset-x-0 mx-auto max-w-[393px] bg-surface/95 backdrop-blur-md px-margin pt-3 pb-8 border-t-0 shadow-[0_-8px_24px_rgba(31,12,15,0.08)] z-30 flex flex-col space-y-2.5">
<!-- Quick Summary Line -->
<div class="flex items-center justify-between px-1 text-text-secondary font-caption text-caption">
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-support-strong"></span>
<span class="font-medium text-text-primary">Total: $140</span>
</div>
<div class="flex items-center space-x-1 font-normal text-text-tertiary">
<span>Sat, Oct 14 at 10:00 AM</span>
</div>
</div>
<!-- Pill Primary Button -->
<button class="w-full h-14 bg-accent-fill hover:bg-accent-pressed active:scale-[0.98] transition-all rounded-full flex items-center justify-center space-x-2 text-white shadow-elevated" type="button">
<span class="font-label text-label font-bold text-[15px]">Continue to checkout</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
