name: capture

# Dispatched from the pod by make-poc-pod. Builds a release APK (production JS, no Metro, no
# dev bubble), drives it with Maestro on a KVM emulator, uploads screenshots + demo GIF as the
# "capture" artifact. Never commits to the repo.
# The emulator steps live in .github/scripts/capture-emulator.sh (copied from the skill's
# templates/): android-emulator-runner runs each `script:` line in its own shell.
on:
  workflow_dispatch:

env:
  APP_ID: com.tendo.app         # expo.android.package from app.json

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4   # caches Gradle dependencies and build outputs between runs
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }   # default also installs legacy "tools", removed from the SDK repo

      - run: npm ci

      - name: Build release APK (expo prebuild + gradle)
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          # The wrapper's 10 s download timeout failed run 1 (services.gradle.org read timeout): give it
          # 2 min and retry the build once on a network error.
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          cd android
          # x86_64 only: the emulator is x86_64, and building all 4 ABIs took most of the 16-23 min build.
          build() { ./gradlew assembleRelease --no-daemon -q --build-cache --parallel -PreactNativeArchitectures=x86_64; }
          # services.gradle.org returned 504 for the distribution zip in runs 1-2 (its .sha256 still
          # answered). On failure, fetch the same zip from a mirror; the wrapper checks it against
          # the official SHA-256, so a tampered or wrong file fails the build instead of running.
          use_mirror() {
            local props=gradle/wrapper/gradle-wrapper.properties v sum
            v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin\.zip$/\1/p' "$props")
            sum=$(curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256")
            [ "${#sum}" -eq 64 ] || { echo "no official checksum for gradle $v"; return 1; }
            sed -i "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-$v-bin.zip#" "$props"
            grep -q '^distributionSha256Sum=' "$props" && sed -i "s/^distributionSha256Sum=.*/distributionSha256Sum=$sum/" "$props" || echo "distributionSha256Sum=$sum" >> "$props"
            cat "$props"
          }
          build || { echo "gradle failed, retrying from a mirror with the official checksum"; use_mirror; build; }
          ls -la app/build/outputs/apk/release/

      - name: Install ffmpeg (not preinstalled on ubuntu-latest)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/capture-emulator.sh expo

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            maestro-out
            ~/.maestro/tests
            capture-tmp/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: capture
          path: |
            screenshots/*.png
            screenshots/demo.gif
          if-no-files-found: error
